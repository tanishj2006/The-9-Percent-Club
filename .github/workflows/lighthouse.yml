# Lighthouse (mobile) against a production build on pull requests. The
# thresholds sit just under the scores measured in docs/audit-2026-11.md, so a
# regression fails the check. Needs no secrets: reports go to temporary public
# storage and the link is printed in the log.
name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Matches the server lhci starts, so canonical links resolve.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.json
