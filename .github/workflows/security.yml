# Dependency audit and secret scan: on every push and pull request, and weekly
# so new advisories against unchanged code still surface. Needs no secrets.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1" # Mondays, 09:00 IST

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Full report for the log, then fail only on critical advisories in what
      # ships. As of November 2026 there is one high (postcss inside next),
      # fixable only by the Next 16 major: see docs/audit-2026-11.md.
      - run: npm audit || true
      - run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the latest
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --redact --no-banner .
